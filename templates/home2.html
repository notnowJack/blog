{% extends "base.html" %}
{% block title %} Blog {% endblock %}

{% block content %}
    <h1 style="color: #124e78;">STINKY POO POO!</h1>

    <ul>
        {% for blog in blogs %}
            <li>
                <a href="/blog/{{blog.id}}" style="color: #3663d3"><strong>{{ blog.title }} </strong></a>
            </li>
        {% endfor %}
    </ul>
        
{% endblock %}
